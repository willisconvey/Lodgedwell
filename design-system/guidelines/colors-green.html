<!-- @dsCard group="Colors" viewport="1120x170" name="Brand green" subtitle="Eucalypt ramp — 600 is --brand" -->
<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
html, body { margin: 0; background: #FAF6EF; }
a:hover { color: #164C3B; }
.reveal { opacity: 1; transform: none; }
body { padding: 24px; }
</style>
</head>
<body>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px;">
  <div style="height: 88px; border-radius: 10px; background: #0E2C22; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #FFFFFF;">green-900<br />#0E2C22</span></div>
  <div style="height: 88px; border-radius: 10px; background: #143B2E; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #FFFFFF;">green-800<br />#143B2E</span></div>
  <div style="height: 88px; border-radius: 10px; background: #164C3B; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #FFFFFF;">green-700<br />#164C3B</span></div>
  <div style="height: 88px; border-radius: 10px; background: #1E5C4A; outline: 2px solid #E8A13A; outline-offset: 2px; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #FFFFFF;">green-600 brand<br />#1E5C4A</span></div>
  <div style="height: 88px; border-radius: 10px; background: #2A7360; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #FFFFFF;">green-500<br />#2A7360</span></div>
  <div style="height: 88px; border-radius: 10px; background: #8FC0B1; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #0E2C22;">green-300<br />#8FC0B1</span></div>
  <div style="height: 88px; border-radius: 10px; background: #DCEBE4; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #0E2C22;">green-100<br />#DCEBE4</span></div>
  <div style="height: 88px; border-radius: 10px; background: #EDF4EF; border: 1px solid #E4DCCF; display: flex; align-items: flex-end; padding: 8px;"><span style="font: 500 11px/1.3 'IBM Plex Mono', monospace; color: #0E2C22;">green-050<br />#EDF4EF</span></div>
</div>
<p style="margin: 12px 0 0; font-family: 'Public Sans', system-ui, sans-serif; font-size: 14px; color: #52635C; line-height: 1.5;">Buttons and links use 600, hover 700, active 900. Footer and CTA band are 900. Tinted panels use 050 / 100.</p>
</body>
</html>
